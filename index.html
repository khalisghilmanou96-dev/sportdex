<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SportDex : recherche de sportifs et d'équipes avec l'API TheSportsDB." />
  <title>SportDex — API Sport</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="page-shell">

    <header class="hero">
      <div>
        <p class="eyebrow">Projet GitHub Pages + TheSportsDB API</p>
        <h1>SportDex</h1>
        <p class="subtitle">
          Recherche un sportif ou une équipe et découvre sa discipline,
          sa nationalité, son club, son poste et sa fiche détaillée.
        </p>
      </div>

      <div class="hero-badge" aria-hidden="true">🏆</div>
    </header>

    <main>

      <section class="controls" aria-label="Recherche sportive">
        <div class="search-box">
          <input
            id="searchInput"
            type="search"
            placeholder="Ex. Lionel Messi, Arsenal, LeBron James…"
            autocomplete="off"
          />

          <select id="searchType" aria-label="Type de recherche">
            <option value="player">Sportif</option>
            <option value="team">Équipe</option>
          </select>

          <button id="searchButton" type="button">
            Rechercher
          </button>
        </div>

        <button
          id="randomButton"
          class="secondary-button"
          type="button"
        >
          🎲 Au hasard
        </button>
      </section>

      <p id="status" class="status" aria-live="polite"></p>

      <!-- PUBLICITÉ 1 : 728x90 DESKTOP / 320x50 MOBILE -->
      <section class="ad-zone ad-zone-top" aria-label="Publicité">

        <div class="ad-desktop">
          <script>
            atOptions = {
              'key' : '5fb675d637c4760cffdf47b74e11aca5',
              'format' : 'iframe',
              'height' : 90,
              'width' : 728,
              'params' : {}
            };
          </script>
          <script src="https://www.highrevenueformat.com/5fb675d637c4760cffdf47b74e11aca5/invoke.js"></script>
        </div>

        <div class="ad-mobile">
          <script>
            atOptions = {
              'key' : '3d4759e54151f2c674a69b6214becc01',
              'format' : 'iframe',
              'height' : 50,
              'width' : 320,
              'params' : {}
            };
          </script>
          <script src="https://www.highrevenueformat.com/3d4759e54151f2c674a69b6214becc01/invoke.js"></script>
        </div>

      </section>

      <section>
        <div class="section-heading">
          <div>
            <p class="eyebrow">Sélection</p>
            <h2>Stars du sport</h2>
          </div>

          <button
            id="loadMoreButton"
            class="ghost-button"
            type="button"
          >
            Afficher plus
          </button>
        </div>

        <div id="sportGrid" class="pokemon-grid"></div>
      </section>

      <!-- PUBLICITÉ 2 : 300x250 -->
      <section class="ad-zone ad-zone-square" aria-label="Publicité">

        <script>
          atOptions = {
            'key' : '4e27e713578d05c724b9ccb81c3885a7',
            'format' : 'iframe',
            'height' : 250,
            'width' : 300,
            'params' : {}
          };
        </script>
        <script src="https://www.highrevenueformat.com/4e27e713578d05c724b9ccb81c3885a7/invoke.js"></script>

      </section>

      <!-- PUBLICITÉ 3 : 300x250 -->
      <section class="ad-zone ad-zone-square" aria-label="Publicité">

        <script>
          atOptions = {
            'key' : '4e27e713578d05c724b9ccb81c3885a7',
            'format' : 'iframe',
            'height' : 250,
            'width' : 300,
            'params' : {}
          };
        </script>
        <script src="https://www.highrevenueformat.com/4e27e713578d05c724b9ccb81c3885a7/invoke.js"></script>

      </section>

      <!-- PUBLICITÉ 4 : 728x90 DESKTOP / 320x50 MOBILE -->
      <section class="ad-zone ad-zone-bottom" aria-label="Publicité">

        <div class="ad-desktop">
          <script>
            atOptions = {
              'key' : '5fb675d637c4760cffdf47b74e11aca5',
              'format' : 'iframe',
              'height' : 90,
              'width' : 728,
              'params' : {}
            };
          </script>
          <script src="https://www.highrevenueformat.com/5fb675d637c4760cffdf47b74e11aca5/invoke.js"></script>
        </div>

        <div class="ad-mobile">
          <script>
            atOptions = {
              'key' : '3d4759e54151f2c674a69b6214becc01',
              'format' : 'iframe',
              'height' : 50,
              'width' : 320,
              'params' : {}
            };
          </script>
          <script src="https://www.highrevenueformat.com/3d4759e54151f2c674a69b6214becc01/invoke.js"></script>
        </div>

      </section>

    </main>
  </div>

  <dialog id="sportDialog" class="pokemon-dialog">
    <button
      id="closeDialogButton"
      class="close-button"
      type="button"
      aria-label="Fermer"
    >
      ×
    </button>

    <div id="sportDetails"></div>
  </dialog>

  <template id="sportCardTemplate">
    <article class="pokemon-card">

      <div class="card-topline">
        <span class="sport-id"></span>
        <span class="card-arrow">↗</span>
      </div>

      <img
        class="pokemon-image"
        src=""
        alt=""
        loading="lazy"
      />

      <div class="card-content">
        <h3 class="pokemon-name"></h3>
        <div class="pokemon-types"></div>
      </div>

    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
